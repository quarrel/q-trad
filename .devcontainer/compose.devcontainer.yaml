services:
  db:
    networks:
      - qtrad-dev

  test-db:
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    environment:
      POSTGRES_USER: qtrad_test_admin
      POSTGRES_PASSWORD: qtrad-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrad_test_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    networks:
      - qtrad-dev

  tailnet-gate:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.tailnet-gate
    restart: unless-stopped
    command: ["sleep", "infinity"]
    networks:
      - qtrad-dev
    healthcheck:
      test:
        [
          "CMD",
          "ssh",
          "-o",
          "BatchMode=yes",
          "-o",
          "ConnectTimeout=8",
          "-o",
          "ConnectionAttempts=1",
          "-o",
          "StrictHostKeyChecking=no",
          "-o",
          "UserKnownHostsFile=/dev/null",
          "-o",
          "LogLevel=ERROR",
          "opc@q-trad-capture.taild465a.ts.net",
          "true",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_interval: 5s
      start_period: 30s

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CODEX_UNSAFE_ALLOW_NO_SANDBOX: "1"
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad:qtrad-dev-only@db:5432/qtrad_dev
      QTRAD_MIGRATION_DATABASE_URL: postgresql+psycopg://qtrad:qtrad-dev-only@db:5432/qtrad_dev
      QTRAD_RESEARCH_ROOT: /workspace/data/research
      QTRAD_TEST_POSTGRES_HOST: test-db
      QTRAD_TEST_POSTGRES_PORT: "5432"
      QTRAD_TEST_POSTGRES_USER: qtrad_test_admin
      QTRAD_TEST_POSTGRES_PASSWORD: qtrad-test-only
      TMPDIR: /workspace/tmp/runtime
      UV_CACHE_DIR: /home/vscode/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy
      tailnet-gate:
        condition: service_healthy
    volumes:
      - .:/workspace
      - qtrad-codex-home:/home/vscode/.codex
      - type: bind
        source: ${HOME}/.codex/sessions
        target: /home/vscode/.codex/sessions
        bind:
          create_host_path: false
      - qtrad-command-history:/commandhistory
      - qtrad-uv-cache:/home/vscode/.cache/uv
      - qtrad-venv:/workspace/.venv
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/ibkr-historical-r2-20260810T081317Z
        target: /workspace/tmp/ibkr-historical-r2-20260810T081317Z
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/r2-confirmatory-ibkr-historical-20260820T051751Z
        target: /workspace/tmp/r2-confirmatory-ibkr-historical-20260820T051751Z
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/qtrad-r4
        target: /workspace/tmp/qtrad-r4
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/r2-confirmatory-ibkr-historical-20260816T090943Z
        target: /workspace/tmp/r2-confirmatory-ibkr-historical-20260816T090943Z
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/qtrad-r2-lab
        target: /workspace/tmp/qtrad-r2-lab
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/capture-snapshot-20260717T044430Z
        target: /workspace/tmp/capture-snapshot-20260717T044430Z
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/wsl/data/q-trad-bulkdata/q-trad/retained-workspace-tmp/ibkr-run-20260806T035300Z
        target: /workspace/tmp/ibkr-run-20260806T035300Z
        read_only: true
        bind:
          create_host_path: false
    networks:
      - qtrad-dev
    gpus: all

networks:
  qtrad-dev:

volumes:
  qtrad-codex-home:
  qtrad-command-history:
  qtrad-uv-cache:
  qtrad-venv:
