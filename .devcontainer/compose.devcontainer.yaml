services:
  db:
    networks:
      - qtrad-dev

  test-db:
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    environment:
      POSTGRES_USER: qtrad_test_admin
      POSTGRES_PASSWORD: qtrad-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrad_test_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    networks:
      - qtrad-dev

  tailnet-gate:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.tailnet-gate
    restart: unless-stopped
    command: ["sleep", "infinity"]
    networks:
      - qtrad-dev
    healthcheck:
      test:
        [
          "CMD",
          "ssh",
          "-o",
          "BatchMode=yes",
          "-o",
          "ConnectTimeout=8",
          "-o",
          "ConnectionAttempts=1",
          "-o",
          "StrictHostKeyChecking=no",
          "-o",
          "UserKnownHostsFile=/dev/null",
          "-o",
          "LogLevel=ERROR",
          "opc@q-trad-capture.taild465a.ts.net",
          "true",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_interval: 5s
      start_period: 30s

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_UNSAFE_ALLOW_NO_SANDBOX: "1"
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad:qtrad-dev-only@db:5432/qtrad_dev
      QTRAD_MIGRATION_DATABASE_URL: postgresql+psycopg://qtrad:qtrad-dev-only@db:5432/qtrad_dev
      QTRAD_RESEARCH_ROOT: /workspace/data/research
      QTRAD_TEST_POSTGRES_HOST: test-db
      QTRAD_TEST_POSTGRES_PORT: "5432"
      QTRAD_TEST_POSTGRES_USER: qtrad_test_admin
      QTRAD_TEST_POSTGRES_PASSWORD: qtrad-test-only
      TMPDIR: /workspace/tmp
      UV_CACHE_DIR: /home/vscode/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy
      tailnet-gate:
        condition: service_healthy
    volumes:
      - .:/workspace
      - qtrad-codex-home:/home/vscode/.codex
      - qtrad-omp-home:/home/vscode/.omp
      - qtrad-command-history:/commandhistory
      - qtrad-uv-cache:/home/vscode/.cache/uv
      - qtrad-venv:/workspace/.venv
    networks:
      - qtrad-dev

networks:
  qtrad-dev:

volumes:
  qtrad-codex-home:
  qtrad-omp-home:
  qtrad-command-history:
  qtrad-uv-cache:
  qtrad-venv:
