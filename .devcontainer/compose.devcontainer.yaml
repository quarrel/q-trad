services:
  db:
    networks:
      - qtrad-dev

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    hostname: qtrad-dev-container
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_UNSAFE_ALLOW_NO_SANDBOX: "1"
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad:qtrad-dev-only@db:5432/qtrad
      QTRAD_RESEARCH_ROOT: /workspace/data/research
      TMPDIR: /workspace/tmp
      UV_CACHE_DIR: /home/vscode/.cache/uv
      TS_AUTH_KEY: ${TS_AUTH_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
      - qtrad-codex-home:/home/vscode/.codex
      - qtrad-command-history:/commandhistory
      - qtrad-uv-cache:/home/vscode/.cache/uv
      - qtrad-venv:/workspace/.venv
    networks:
      - qtrad-dev
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.default.disable_ipv6=0
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - MKNOD

networks:
  qtrad-dev:
    enable_ipv6: true

volumes:
  qtrad-codex-home:
  qtrad-command-history:
  qtrad-uv-cache:
  qtrad-venv:
