services:
  db:
    networks:
      - qtrad-dev

  tailnet-gate:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.tailnet-gate
    restart: unless-stopped
    command: ["sleep", "infinity"]
    networks:
      - qtrad-dev
    healthcheck:
      test:
        [
          "CMD",
          "ssh",
          "-o",
          "BatchMode=yes",
          "-o",
          "ConnectTimeout=8",
          "-o",
          "ConnectionAttempts=1",
          "-o",
          "StrictHostKeyChecking=no",
          "-o",
          "UserKnownHostsFile=/dev/null",
          "-o",
          "LogLevel=ERROR",
          "opc@q-trad-capture.taild465a.ts.net",
          "true",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_UNSAFE_ALLOW_NO_SANDBOX: "1"
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad:qtrad-dev-only@db:5432/qtrad
      QTRAD_RESEARCH_ROOT: /workspace/data/research
      TMPDIR: /workspace/tmp
      UV_CACHE_DIR: /home/vscode/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      tailnet-gate:
        condition: service_healthy
    volumes:
      - .:/workspace
      - qtrad-codex-home:/home/vscode/.codex
      - qtrad-command-history:/commandhistory
      - qtrad-uv-cache:/home/vscode/.cache/uv
      - qtrad-venv:/workspace/.venv
    networks:
      - qtrad-dev

networks:
  qtrad-dev:

volumes:
  qtrad-codex-home:
  qtrad-command-history:
  qtrad-uv-cache:
  qtrad-venv:
