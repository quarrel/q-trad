name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env:
          POSTGRES_DB: qtrad_ci
          POSTGRES_USER: qtrad_ci
          POSTGRES_PASSWORD: qtrad-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtrad_ci -d qtrad_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad_ci:qtrad-ci-only@127.0.0.1:5432/qtrad_ci
      QTRAD_TEST_DATABASE_URL: postgresql+asyncpg://qtrad_ci:qtrad-ci-only@127.0.0.1:5432/qtrad_ci
      QTRAD_MIGRATION_DATABASE_URL: postgresql+psycopg://qtrad_ci:qtrad-ci-only@127.0.0.1:5432/qtrad_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyright

      - name: Check shell scripts
        run: shellcheck ops/capture/*.sh ops/dev/*.sh ops/research/*.sh ops/ibkr/*.sh

      - name: Verify backup restore in real PostgreSQL containers
        run: ops/dev/restore-verification-integration.sh

      - name: Migrate to frozen collector schema
        run: uv run alembic upgrade 0003

      - name: Verify reconciliation against frozen collector schema
        run: >-
          uv run pytest
          tests/test_postgres_integration.py::test_stale_run_reconciliation_is_exact_atomic_and_preserves_current_run

      - name: Migrate isolated database to head
        run: uv run alembic upgrade head

      - name: Test without PostgreSQL
        run: >-
          env -u QTRAD_DATABASE_URL
          -u QTRAD_TEST_DATABASE_URL
          -u QTRAD_MIGRATION_DATABASE_URL
          uv run pytest
          -m "not postgres"
          -n 2
          --dist worksteal
          --durations=25
          --durations-min=0.5
          --junitxml=pytest-parallel.xml

      - name: Test PostgreSQL integration
        run: >-
          uv run pytest
          -m postgres
          -n 0
          --durations=25
          --durations-min=0.5
          --junitxml=pytest-postgres.xml

      - name: Upload pytest timing reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-timing-${{ github.run_attempt }}
          path: |
            pytest-parallel.xml
            pytest-postgres.xml
          if-no-files-found: warn
          retention-days: 7
