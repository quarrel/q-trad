services:
  db:
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    environment:
      POSTGRES_DB: qtrad_dev
      POSTGRES_USER: qtrad
      POSTGRES_PASSWORD: qtrad-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrad -d qtrad_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - qtrad-postgres:/var/lib/postgresql

  app:
    image: qtrad-app:local
    build:
      context: .
    profiles: ["tools"]
    environment: &app_environment
      QTRAD_DATABASE_URL: postgresql+asyncpg://qtrad:qtrad-dev-only@db:5432/qtrad_dev
      QTRAD_RESEARCH_ROOT: /app/data/research
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  api:
    image: qtrad-app:local
    build:
      context: .
    command: ["python", "-m", "qtrad", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_environment
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${QTRAD_API_PORT:-8080}:8000"
    volumes:
      - ./data:/app/data

volumes:
  qtrad-postgres:
